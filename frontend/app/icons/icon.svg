<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#12122a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c5cfc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <line x1="128" y1="0" x2="128" y2="512" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="384" y1="0" x2="384" y2="512" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="128" x2="512" y2="128" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="0" y1="384" x2="512" y2="384" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <polyline
    points="56,256 136,256 168,156 200,356 232,156 264,356 296,156 328,256 376,256 456,256"
    fill="none" stroke="url(#pulse)" stroke-width="22"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#00d4ff" filter="url(#glow)"/>
</svg>